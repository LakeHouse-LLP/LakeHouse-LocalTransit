name: Bug report
description: Report a problem with this template or a project created from it
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Prefer the organization `.github` runbook defaults (see [docs/org.md](../blob/main/docs/org.md)) unless this project needs an override.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, commands, and relevant logs
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ref / version
      placeholder: main @ sha, or release tag
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
        - label: This does not include secrets, client data, or CAD binaries
          required: true
