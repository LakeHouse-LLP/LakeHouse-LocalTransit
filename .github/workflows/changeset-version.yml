# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
name: changeset-version

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: changeset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: version-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Validate changesets config (PR / merge queue)
        # Skip when there are intentionally no pending changesets:
        # - Dependabot (actor / dependabot/* head; merge_group actor is the queue bot)
        # - changesets/action Version PR (changeset-release/* already consumed them)
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          github.actor != 'dependabot[bot]' &&
          !startsWith(github.head_ref || github.event.merge_group.head_ref || '', 'dependabot/') &&
          !startsWith(github.head_ref || github.event.merge_group.head_ref || '', 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
        run: |
          npm run release:validate
          npm run check:pins
          # Stacked PRs are not based on main — compare against the PR base.
          # merge_group base_ref is main (only PRs targeting main enter the queue).
          git fetch origin "$BASE_REF" --depth=50
          npx changeset status --since="origin/$BASE_REF"

      - name: Release files and pins (Version PR / Dependabot)
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          (
            github.actor == 'dependabot[bot]' ||
            startsWith(github.head_ref || github.event.merge_group.head_ref || '', 'dependabot/') ||
            startsWith(github.head_ref || github.event.merge_group.head_ref || '', 'changeset-release/')
          )
        run: |
          npm run release:validate
          npm run check:pins

      - name: Create Version PR or CI tag
        # Never run on pull_request or merge_group — only after land on main.
        # Requires Sen-only "Allow GitHub Actions to create and approve pull
        # requests" (docs/sen-only-github-settings.md). Failures must show red.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run changeset:version
          publish-script: npm run changeset:tag
          create-github-releases: false
          push-git-tags: false
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

