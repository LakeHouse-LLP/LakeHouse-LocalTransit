# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
# merge_group: required so GitHub merge queue re-checks on GitHub-hosted runners.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Wrong remote guard
        run: npm run check:remote
        env:
          ALLOW_TEMPLATE_REMOTE: "1"

      - name: Tier guard
        run: npm run check:tier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No self-hosted runners
        run: npm run check:runners

      - name: README AUTO freshness
        run: npm run readme:check

      - name: CITATION.cff freshness
        run: npm run citation:check

      - name: Org identity invariants
        run: npm run check:org

      - name: No hardcoded org slug
        run: npm run check:org-slug

      - name: Action pins match .lakehouse/pins.json
        run: npm run check:pins

      - name: Release files present
        run: npm run release:validate

      - name: Discoverability (README paragraph)
        run: npm run check:discoverability
        env:
          DISCOVERABILITY_REQUIRE_METADATA: "false"

      - name: Writing style (copy lint)
        run: npm run check:writing-style

      - name: Changelog policy
        # Dependabot bumps are labeled skip-changelog (see .github/dependabot.yml).
        # Also skip by actor / dependabot/* head ref (merge queue actor is not Dependabot).
        if: >
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          github.actor != 'dependabot[bot]' &&
          !startsWith(github.head_ref || github.event.merge_group.head_ref || '', 'dependabot/')
        run: npm run check:changelog -- --strict

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full-history scan
        run: npm run check:gitleaks
