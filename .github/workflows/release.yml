# Action SHAs and org reusable-workflow catalog: .lakehouse/pins.json
# Flow: version PR (changeset-version) → CI tag vX.Y.Z → build → checksums →
# attest-build-provenance → draft GitHub Release → npm OIDC trusted publish.
name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate release scripts without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Release scripts dry-run
        run: |
          npm run release:validate
          npm run release:notes -- 0.0.0-test
          npm run release:build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      discussions: write
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node (npm OIDC)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build artifacts + SHA256SUMS
        run: npm run release:build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Render release notes
        run: npm run release:notes -- ${{ github.ref_name }}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tgz
            release-assets/SHA256SUMS

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          body_path: release-assets/RELEASE_NOTES.md
          files: |
            release-assets/*.tgz
            release-assets/SHA256SUMS

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --access public --provenance
