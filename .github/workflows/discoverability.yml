# README first paragraph + repo description/topics (8–20) via gh api.
# Public repos: GitHub-hosted only. See docs/discoverability.md.
# pull_request with no branches filter — stacked PRs must run CI.
# merge_group: merge queue re-check (public main; GitHub-hosted only).
# Action SHAs: .lakehouse/pins.json
#
# TODO: when org .github publishes a reusable discoverability workflow, replace
# this local workflow with uses: {owner}/.github/.github/workflows/...@ref

name: discoverability

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: discoverability-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discoverability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Discoverability check
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          # Sen: set topics (8–20) + description, then flip to "true".
          DISCOVERABILITY_REQUIRE_METADATA: "false"
        run: npm run check:discoverability
